<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The arc reactor, the same drawing as the shortcut icon in scripts/icon.mjs. -->
  <defs>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#8fe9ff"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4fd1ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#4fd1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31.4" fill="#01060c"/>
  <circle cx="32" cy="32" r="21" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="17.6" fill="none" stroke="#4fd1ff" stroke-opacity=".7" stroke-width="1.9"/>
  <circle cx="32" cy="32" r="25.1" fill="none" stroke="#4fd1ff" stroke-width="5.4" stroke-dasharray="14.29 1.48" stroke-dashoffset="7.14" transform="rotate(-90 32 32)"/>
  <circle cx="32" cy="32" r="11.5" fill="url(#core)"/>
</svg>
